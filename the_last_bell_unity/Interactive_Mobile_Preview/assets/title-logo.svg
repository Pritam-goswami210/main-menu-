<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>
    <!-- Grunge filter for eroded letters -->
    <filter id="horrorChalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bloodTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc1818"/>
      <stop offset="40%" stop-color="#990f0f"/>
      <stop offset="85%" stop-color="#6b0808"/>
      <stop offset="100%" stop-color="#3d0303"/>
    </linearGradient>
  </defs>

  <style>
    .title-the {
      font-family: 'Cinzel', 'Georgia', serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: 12px;
      fill: #e8e4dc;
      text-anchor: middle;
      opacity: 0.92;
    }
    .title-last {
      font-family: 'Impact', 'Cinzel Decorative', 'Times New Roman', serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: 6px;
      fill: #f1ede6;
    }
    .title-bell {
      font-family: 'Impact', 'Cinzel Decorative', 'Times New Roman', serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: 6px;
      fill: url(#bloodTextGrad);
    }
  </style>

  <!-- "THE" with chalk erosion -->
  <g filter="url(#horrorChalk)">
    <text x="350" y="58" class="title-the">THE</text>
  </g>

  <!-- "LAST BELL" Group -->
  <g filter="url(#horrorChalk)">
    <!-- "LAST" -->
    <text x="50" y="160" class="title-last">LAST</text>
    
    <!-- "BELL" with bloody tint -->
    <text x="330" y="160" class="title-bell" filter="url(#bloodGlow)">BELL</text>

    <!-- Blood drips from "BELL" -->
    <!-- Drip 1 from B -->
    <path d="M 355,160 Q 354,185 352,205 Q 350,215 353,218 Q 356,215 355,200 Z" fill="#750a0a"/>
    <circle cx="353" cy="221" r="2.5" fill="#8f0e0e"/>

    <!-- Drip 2 from E -->
    <path d="M 435,160 Q 436,178 434,192 Q 432,198 435,200 Q 437,198 436,188 Z" fill="#800c0c"/>
    <circle cx="435" cy="203" r="2" fill="#9e1111"/>

    <!-- Drip 3 from L1 -->
    <path d="M 505,160 Q 503,185 504,212 Q 502,226 505,230 Q 508,226 506,208 Z" fill="#660707"/>
    <circle cx="505" cy="233" r="3" fill="#8a0c0c"/>

    <!-- Drip 4 from L2 -->
    <path d="M 575,160 Q 576,180 574,202 Q 572,212 575,215 Q 577,212 576,196 Z" fill="#7d0a0a"/>
    <circle cx="575" cy="218" r="2.2" fill="#9e1111"/>

    <!-- Horizontal blood streak underline below LAST BELL -->
    <path d="M 45,178 
             C 120,175 220,174 340,176 
             C 450,177 540,179 625,185 
             C 550,183 450,181 330,180 
             C 210,179 110,181 45,178 Z" 
          fill="#8f1010" opacity="0.85"/>
    <path d="M 70,179 Q 250,176 430,178 T 610,186" 
          stroke="#420606" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="628" cy="186" r="1.5" fill="#8f1010"/>
  </g>
</svg>
